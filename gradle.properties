# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21

# Game
minecraft_version=1.21.1
minecraft_compat_version=1.21
yarn_mappings=1.21.1+build.3
yarn_mappings_patch_neoforge_version=1.21+build.4

# Loader / platforms
enabled_platforms=fabric,neoforge
fabric_loader_version=0.16.9
# Aligned with the artificers baseline; Forgified Fabric API requires NeoForge >= 21.1.219.
neoforge_version=21.1.219

# Mod identity
# NOTE: three intentionally-distinct identifiers. Do NOT collapse into one.
#   content_namespace  -> ResourceLocation/Identifier namespace + asset/data dirs (persistent, externally visible)
#   fabric_mod_id      -> Fabric loader mod id
#   neoforge_mod_id    -> NeoForge loader mod id (hyphen not allowed by NeoForge)
content_namespace=rpg-minibosses
fabric_mod_id=rpg-minibosses
neoforge_mod_id=rpg_minibosses

maven_group=net
archives_name=rpg-minibosses
mod_version=2.0.0

# Core API dependencies (Modrinth coordinates use -fabric / -neoforge suffixes)
fabric_api_version=0.116.4+1.21.1
forgified_fabric_api_version=0.116.7+2.2.4+1.21.1

# Spell Engine ecosystem
spell_engine_version=1.9.10+1.21.1
spell_power_version=1.5.0+1.21.1
tiny_config_version=3.1.0
cloth_config_version=15.0.130
player_anim_version=2.0.1+1.21.1

# Content / library deps
azure_lib_version=3.1.4
wizards_version=2.7.0+1.21.1
runes_version=1.2.0+1.21.1
# Structure Pool API has divergent patch releases per loader (see migration notes)
structure_pool_api_version_fabric=1.2.1+1.21.1
structure_pool_api_version_neoforge=1.2.0+1.21.1
# Fabric-only NBT structure placement (no NeoForge build -> loader stub on NeoForge)
structure_placer_api_version=1.1.0

# Fabric-only accessory slot provider
trinkets_version=3.10.0
# NeoForge accessory slot provider (Trinkets replacement)
accessories_version=1.1.0-beta.48+1.21.1
owo_version=0.12.15.4+1.21
owo_neo_version=0.12.15.5-beta.1+1.21
