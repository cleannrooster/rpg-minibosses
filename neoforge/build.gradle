plugins {
    id 'com.gradleup.shadow'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    maven { name = 'Ladysnake Libs'; url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.fabricmc.net' }
    mavenLocal()
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    include(modImplementation("dev.eann:atlasvfx-neoforge:${rootProject.atlasvfx_version}"))

    // Spell Engine ecosystem
    // Optional at runtime: compiled against, never required. The dev client runs with them unless
    // launched with -PnoSpellEngine, which is how the "without Spell Engine" setup is tested.
    modCompileOnly "maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}"
    modCompileOnly "maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}"
    if (!project.hasProperty('noSpellEngine')) {
        modLocalRuntime "maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}"
        modLocalRuntime "maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}"
        // Spell Engine's own requirement, for the dev client only (Player Animator's NeoForge build uses the `forge` classifier).
        modLocalRuntime "dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}"
    }
    include(modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}"))
    // Player Animator uses the `forge` classifier for its NeoForge artifact.
   // modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // Content / library deps
    modImplementation "mod.azure.azurelib:azurelib-neo-${rootProject.minecraft_version}:${rootProject.azure_lib_version}"
    modImplementation "maven.modrinth:structure-pool-api:${rootProject.structure_pool_api_version_neoforge}-${platform}"
    //modImplementation "maven.modrinth:wizards:${rootProject.wizards_version}-${platform}"
    modImplementation "maven.modrinth:runes:${rootProject.runes_version}-${platform}"

    // NeoForge accessory slot provider (Trinkets replacement)
    modImplementation "maven.modrinth:owo-lib:${rootProject.owo_neo_version}"
    modImplementation "io.wispforest:accessories-neoforge:${rootProject.accessories_version}"
    forgeRuntimeLibrary("blue.endless:jankson:1.2.2")
    forgeRuntimeLibrary("io.wispforest:endec:0.1.5.1")
    forgeRuntimeLibrary("io.wispforest.endec:gson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:jankson:0.1.3.1")
    forgeRuntimeLibrary("io.wispforest.endec:netty:0.1.2")
}

processResources {
    inputs.property 'version', project.version
    tasks.withType(Copy).configureEach { duplicatesStrategy DuplicatesStrategy.INCLUDE }

    filesMatching('META-INF/neoforge.mods.toml') {
        // Strip Maven "+build" suffixes so version ranges in the toml stay valid.
        def cleaned = project.properties.collectEntries { k, v ->
            def s = v?.toString()
            [(k.toString()): (s?.contains('+') ? s.substring(0, s.indexOf('+')) : s)]
        }
        cleaned['neoforge_mod_id'] = rootProject.neoforge_mod_id
        cleaned['version'] = project.version
        expand(cleaned)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Dev runs can use a separate game directory: -PrunDir=<dir>, and "without Spell Engine" runs default to
// their own, so mods kept in the normal run/mods (some of which need Spell Engine) do not stop them starting.
def customRunDir = project.findProperty('runDir') ?: (project.hasProperty('noSpellEngine') ? 'run_no_spell_engine' : null)
if (customRunDir != null) {
    loom {
        runs {
            configureEach {
                runDir = customRunDir
            }
        }
    }
}
