plugins {
    id 'com.gradleup.shadow'
}

def platform = project.name

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration() {
        client = true
        modId = rootProject.fabric_mod_id
        outputDirectory = project(':common').file('src/main/generated')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.azuredoom.com/mods' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    maven { name = 'Ladysnake Libs'; url = 'https://maven.ladysnake.org/releases' }
    mavenLocal()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Spell Engine ecosystem
    modImplementation "maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}"
    modImplementation "maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}"
    include(modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}"))
   // modImplementation "dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}"

    // Content / library deps
    modImplementation "mod.azure.azurelib:azurelib-${platform}-${rootProject.minecraft_version}:${rootProject.azure_lib_version}"
    modImplementation "maven.modrinth:structure-pool-api:${rootProject.structure_pool_api_version_fabric}-${platform}"
  //  modImplementation "maven.modrinth:wizards:${rootProject.wizards_version}-${platform}"
    modImplementation "maven.modrinth:runes:${rootProject.runes_version}-${platform}"

    // Fabric-only deps
    include(modImplementation("maven.modrinth:structureplacerapi:${rootProject.structure_placer_api_version}"))
    modCompileOnly "dev.emi:trinkets:${rootProject.trinkets_version}"
}

processResources {
    inputs.property 'version', project.version
    tasks.withType(Copy).configureEach { duplicatesStrategy DuplicatesStrategy.INCLUDE }

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'fabric_mod_id': rootProject.fabric_mod_id
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
